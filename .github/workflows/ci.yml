name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The full `check` also typechecks the DSH plugin and client entry points,
      # which needs a DeepSeek Harness checkout that is not available on CI.
      # `check:core` covers everything that builds from this repository alone.
      - run: pnpm run check:core

      - name: Build publishable bundle
        run: pnpm run bundle

  release:
    name: Version & publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version packages" pull request while changesets are
      # pending, and publishes @orbis/remote-dsh to npm once that PR is merged.
      # `prepack` rebuilds dist/ from the released commit before it is packed.
      - uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
