name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check:core` covers the DSH-independent subset: the adapter and host
      # depend on structural ports only, so they typecheck without the Harness.
      - run: pnpm run check:core

      # The plugin is where DSH services are cast into those ports, so it is the
      # one place an upstream removal can pass every other gate. `check:dsh`
      # builds the publishable bundle, then typechecks that composition and runs
      # the full suite. The DSH wave is published to npm and installed by the
      # frozen lockfile above, so this needs no Harness source checkout.
      - name: Build publishable bundle and check the DSH composition
        run: pnpm run check:dsh

  release_mode:
    name: Select release mode
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action/select-mode@v2

  version:
    name: Update draft release PR
    needs: release_mode
    if: needs.release_mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keep one draft release PR updated with every pending changeset. Merging
      # this PR is the explicit decision to publish the accumulated release.
      # The version script prepends release-level notes to the generated
      # changelog entry, which this action also uses for the PR description.
      - uses: changesets/action/version@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm run version:packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): prepare next release"
          pr-draft: "always"

  publish:
    name: Publish release
    needs: release_mode
    if: needs.release_mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # `prepack` rebuilds dist/ from the released commit before it is packed.
      - uses: changesets/action/publish@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm run release
